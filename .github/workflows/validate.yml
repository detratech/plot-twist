name: Validate Plot Twist

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check cards.js
          node --check deck-a.js
          node --check deck-b.js
          node --check deck-c.js
          node --check deck-d.js
          node --check deck-e.js
          node --check deck-f.js
          node --check deck-g.js
          node --check deck-h.js
          node --check history-a.js
          node --check history-b.js
          node --check history-c.js
          node --check history-d.js
          node --check history-reviewed.js
          node --check categories.js
          node --check app.js
          node --check choice-ui.js
          node --check history-ui.js
          node --check consistency-ui.js
          node --check sw.js
          node --check validate-content.cjs
          node --check validate-runtime.cjs

      - name: Audit complete 200-card deck and v6.3 content layers
        run: node validate-content.cjs

      - name: Audit runtime, PWA, state, and workflow wiring
        run: node validate-runtime.cjs